{% if page.paginator.num_pages > 1 %}<nav class="pagination" aria-label="Pagination"><span>Page {{ page.number }} of {{ page.paginator.num_pages }} · {{ page.paginator.count }} row{{ page.paginator.count|pluralize }}</span>{% if page.has_previous %}<a href="?{{ query_string }}&sort={{ sort }}&dir={{ dir }}&page={{ page.previous_page_number }}">← Previous</a>{% endif %}{% if page.has_next %}<a href="?{{ query_string }}&sort={{ sort }}&dir={{ dir }}&page={{ page.next_page_number }}">Next →</a>{% endif %}</nav>{% endif %}
