name: Application and security checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: billing
          POSTGRES_PASSWORD: ci-isolated-database-only
          POSTGRES_DB: billing
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U billing" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DEBUG: 'true'
      DB_HOST: localhost
      DB_PASSWORD: ci-isolated-database-only
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python manage.py collectstatic --noinput
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test billing.tests --noinput
      - name: Verify generated runtime policies
        run: |
          PYTHONPATH=. python scripts/generate_database_roles.py
          git diff --exit-code -- deploy/database-roles.sql
      - run: cfn-lint deploy/infrastructure.yaml
      - run: python manage.py migrate --noinput
      - run: python manage.py run_worker --once --limit 5
        env:
          RUNTIME_ROLE: collector
      - name: Heterogeneous 100-customer smoke workload
        run: python manage.py security_load --months 1 --services 1 --requests 16 --readers 4 --collect-sources 130 --output /tmp/security-load.json
      - run: python manage.py check --deploy --fail-level WARNING
        env:
          DEBUG: 'false'
          SECRET_KEY: ci-validation-only-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-capacity-${{ github.sha }}
          path: /tmp/security-load.json
          retention-days: 14
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: mkdir -p /tmp/security-evidence
      - run: pip-audit -r requirements.txt --format json --output /tmp/security-evidence/dependencies.json
      - run: bandit -r billing config scripts -ll -ii -f json -o /tmp/security-evidence/bandit.json
      - run: python scripts/install_scanners.py
      - run: .deployment/tools/gitleaks git --redact --report-format json --report-path /tmp/security-evidence/secrets.json
      - run: docker build --pull -f deploy/Dockerfile -t billing-review:${{ github.sha }} .
      - name: Scan images; critical/high findings fail
        run: |
          scan_status=0
          for image in billing-review:${{ github.sha }} postgres:17-alpine caddy:2-alpine; do
            report=$(printf '%s' "$image" | tr ':/' '_')
            .deployment/tools/trivy image --timeout 10m --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output "/tmp/security-evidence/$report.json" "$image" || scan_status=1
          done
          exit "$scan_status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: security-scans-${{ github.sha }}
          path: /tmp/security-evidence
          retention-days: 14
