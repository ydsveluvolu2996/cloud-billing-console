name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: billing
          POSTGRES_PASSWORD: test-database-password
          POSTGRES_DB: billing
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U billing" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DEBUG: 'true'
      DB_HOST: localhost
      DB_PASSWORD: test-database-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py collectstatic --noinput
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test billing.tests
      - run: python manage.py check --deploy
        env:
          DEBUG: 'false'
          SECRET_KEY: ci-validation-placeholder-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
