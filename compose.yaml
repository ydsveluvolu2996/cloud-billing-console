name: cloud-billing
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: billing
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U billing -d billing']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_NAME: billing
      DB_USER: billing
    depends_on:
      db:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *logging
  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    command: ["python", "manage.py", "run_worker"]
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_NAME: billing
      DB_USER: billing
    depends_on:
      db:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    stop_grace_period: 120s
    logging: *logging
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      DASHBOARD_HOST: ${DASHBOARD_HOST:?Set DASHBOARD_HOST}
      DASHBOARD_ALIASES: ${DASHBOARD_ALIASES:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on: [app]
    logging: *logging
volumes:
  pgdata:
  caddydata:
  caddyconfig:
