AWSTemplateFormatVersion: '2010-09-09'
Description: Read-only Cost Explorer connection for Cloud Billing Console. Creates one role with six read-only billing actions.
Parameters:
  CollectorRoleArn:
    Type: String
    Description: Exact IAM role ARN of the billing collector in your provider's AWS account.
    AllowedPattern: '^arn:aws:iam::[0-9]{12}:role/[a-zA-Z0-9+=,.@_/-]+$'
  ExternalId:
    Type: String
    Description: Unique customer identifier generated by the billing dashboard.
    AllowedPattern: '^[a-f0-9-]{36}$'
  ExpectedAccountId:
    Type: String
    Description: Customer management/payer or standalone account ID.
    AllowedPattern: '^[0-9]{12}$'
Rules:
  CorrectAccount:
    Assertions:
      - Assert:
          Fn::Equals:
            - Ref: AWS::AccountId
            - Ref: ExpectedAccountId
        AssertDescription: Sign into the customer account specified by this onboarding link.
Resources:
  CostReadRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: CostReadOnly
      Path: /BillingConsole/
      Description: Allows only the configured billing collector to read Cost Explorer data.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS:
                Ref: CollectorRoleArn
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId:
                  Ref: ExternalId
      Policies:
        - PolicyName: ReadCostExplorer
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ce:GetCostAndUsage
                  - ce:GetDimensionValues
                  - ce:GetTags
                  - ce:GetCostCategories
                  - ce:GetCostForecast
                  - ce:GetCostAndUsageWithResources
                Resource: '*'
Outputs:
  RoleArn:
    Description: Paste this ARN into the customer's dashboard connection form.
    Value:
      Fn::GetAtt: [CostReadRole, Arn]
