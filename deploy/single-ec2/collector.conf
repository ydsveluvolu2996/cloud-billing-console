[Unit]
Requires=cloud-billing-metadata-guard.service
After=cloud-billing-metadata-guard.service docker.service
[Service]
ExecStartPre=+/usr/local/sbin/cloud-billing-metadata-guard --check
MemoryHigh=384M
MemoryMax=512M
CPUQuota=75%
Nice=10
LogsDirectory=
LogsDirectory=cloud-billing/collector
StandardOutput=append:/var/log/cloud-billing/collector/worker.log
StandardError=append:/var/log/cloud-billing/collector/worker.log
